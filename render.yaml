services:
  # Backend Web Service (Django + Daphne)
  - type: web
    name: thozhilurappu-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT backend.asgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: thozhilurappu-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: thozhilurappu-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*" # Set this to your specific domains later

  # Frontend Static Site (Vite)
  - type: web
    name: thozhilurappu-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://thozhilurappu-backend.onrender.com/api
      - key: VITE_WS_URL
        value: wss://thozhilurappu-backend.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://thozhilurappu-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  # Redis for Caching and WebSockets (Key Value)
  - type: keyvalue
    name: thozhilurappu-redis
    plan: free
    ipAllowList: [] # Allow all internal traffic

# Database Infrastructure
databases:
  - name: thozhilurappu-db
    plan: free
